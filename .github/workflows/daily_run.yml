name: Daily Stock & Portfolio Analysis

on:
  schedule:
    # All times UTC. ET = UTC-4 (EDT) / UTC-5 (EST). Dublin = UTC+0/+1.
    - cron: '45 13 * * 1-5'  # 13:45 UTC → RUN_MODE=paper_trade (09:45 ET, 15 min after open)
    - cron: '30 21 * * 1-5'  # 21:30 UTC → RUN_MODE=full (16:30 ET after close)
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: portfolio | full | alert_check | paper_trade'
        required: false
        default: 'full'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to commit paper-trade state (watchlist + NAV/log)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install optional dependencies
        run: pip install vectorbt duckdb
        continue-on-error: true

      - name: Install CJK fonts (fixes Chinese labels in matplotlib charts)
        run: |
          sudo apt-get install -y fonts-wqy-microhei
          python -c "import matplotlib; import shutil; shutil.rmtree(matplotlib.get_cachedir(), ignore_errors=True)"

      # ── Persistent storage ────────────────────────────────────────────────
      # GitHub Actions runners are ephemeral — no disk survives between runs.
      # cache/ holds: alert dedup JSON, daily portfolio snapshots, FF5 pickle
      # (up to 20-hour TTL), and S&P 500 universe cache.
      # Unique key per run-id so every run saves; restore-keys picks the
      # most recent prior snapshot automatically.
      - name: Ensure persistent dirs exist
        run: mkdir -p cache data

      - name: Restore persistent cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: persist-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            persist-${{ runner.os }}-

      - name: Resolve run mode from schedule
        id: mode
        # Prefer github.event.schedule (exact cron string that fired) so a delayed
        # 13:45 UTC trigger arriving at 14:xx UTC still resolves to paper_trade
        # instead of falling through to full mode.
        run: |
          INPUT_MODE="${{ github.event.inputs.run_mode }}"
          SCHED="${{ github.event.schedule }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "run_mode=$INPUT_MODE" >> $GITHUB_OUTPUT
          elif [ "$SCHED" = "45 13 * * 1-5" ]; then
            echo "run_mode=paper_trade" >> $GITHUB_OUTPUT
          else
            echo "run_mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Run agent
        env:
          RUN_MODE: ${{ steps.mode.outputs.run_mode }}
          # Broker APIs
          IBKR_FLEX_TOKEN:    ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_QUERY_ID:      ${{ secrets.IBKR_QUERY_ID }}
          T212_API_KEY:       ${{ secrets.T212_API_KEY }}
          T212_API_SECRET:    ${{ secrets.T212_API_SECRET }}
          ETORO_API_KEY:      ${{ secrets.ETORO_API_KEY }}
          # Email delivery (SMTP — primary)
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          REPORT_TO_EMAIL:    ${{ secrets.REPORT_TO_EMAIL }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          # Email delivery (SendGrid — fallback)
          SENDGRID_API_KEY:   ${{ secrets.SENDGRID_API_KEY }}
          # Optional data enrichment
          ALPHA_VANTAGE_KEY:  ${{ secrets.ALPHA_VANTAGE_KEY }}
          # Alpaca paper trading
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_DRY_RUN:      ${{ secrets.PAPER_DRY_RUN }}
        run: python main.py

      # Auto-commit paper-trade state: watchlist promotions/pruning AND the
      # durable NAV history / trade log / trailing-stop watermarks. These must
      # be committed (not left in the .gitignored, evicted cache/) so the
      # performance metrics survive across runs. pull --rebase before push
      # avoids non-fast-forward failures when runs overlap.
      - name: Commit paper-trade state (paper_trade only)
        if: steps.mode.outputs.run_mode == 'paper_trade'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/watchlist.csv data/paper_state 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No paper-trade state changes to commit"
          else
            git commit -m "chore: paper-trade state update (watchlist + NAV/trade log) [skip ci]"
            git pull --rebase origin master || { git rebase --abort 2>/dev/null; exit 0; }
            git push
          fi
