# Stock Agent Configuration
# All sensitive keys are loaded from environment variables

api:
  anthropic_api_key: ${ANTHROPIC_API_KEY}
  alpha_vantage_key: ${ALPHA_VANTAGE_KEY}
  news_api_key: ${NEWS_API_KEY}
  sendgrid_api_key: ${SENDGRID_API_KEY}

email:
  recipient: ${RECIPIENT_EMAIL}
  sender: "stock-agent@example.com"
  sender_name: "Stock AI Agent"
  subject_prefix: "[Stock Agent]"
  use_smtp: true
  smtp_host: ${SMTP_HOST}
  smtp_port: ${SMTP_PORT}
  smtp_user: ${SMTP_USER}
  smtp_password: ${SMTP_PASS}

scheduler:
  daily_run_time: "06:00"
  timezone: "America/New_York"

limits:
  history_days: 730
  backtest_history_days: 730

database:
  path: "data/stock_agent.db"

logging:
  level: "INFO"
  file: "logs/agent.log"

monte_carlo:
  n_paths: 50000
  horizon: 21
  model: "hawkes"

factor_model:
  window_days: 252        # OLS regression window; falls back to available days if fewer
  min_window_days: 63     # skip ticker if aligned days < this

execution:
  # Trade-execution / laddering plan per stock (held + watchlist). Decision still
  # comes from the FF5 model; this only governs price, size, and pace of fills.
  atr_period:        14     # ATR lookback (Wilder)
  n_rungs:           5      # ladder rungs (4–6)
  rung_spacing_atr:  0.5    # rung spacing as a multiple of ATR
  hvn_bins:          24     # price buckets for the volume profile
  hvn_lookback:      120    # trading days of volume-profile history
  hvn_top:           4      # number of high-volume nodes to keep
  hvn_snap_atr:      0.5    # snap a rung to an HVN within this × ATR
  adv_window:        20     # trading days for average daily volume
  participation_pct: 0.08   # ≤8% of ADV per day (hard liquidity cap; 5–10% band)
  max_position_pct:  0.15   # watchlist ladder sizing: target ≤15% of NAV per name
  options_enabled:   true   # attempt Max Pain / peak-gamma for every ticker
  ohlcv_days:        180    # OHLCV history window pulled for this analysis

paper_trade:
  universe_size: 50        # total tickers screened (watchlist + random S&P 500 fill)
  max_position_pct: 0.15   # hard cap: max equity fraction per single position
  participation_pct: 0.08  # cap a single day's BUY at this fraction of the name's ADV
  # ── Risk gates (checked before opening any new position) ──────────────────
  max_positions: 10        # halt new buys once this many open positions exist
  var_limit_pct: 0.05      # halt new buys if portfolio 1-day EWMA VaR_95 > 5%
  max_portfolio_beta: 1.5  # halt new buys if portfolio beta vs SPY > this
  max_drawdown_halt: 0.10  # halt new buys if equity fell > 10% from starting_equity
  starting_equity: 100000  # Alpaca paper account starting equity (USD)
  stop_loss_pct: 0.15      # close any position whose unrealised loss exceeds 15%
  trailing_stop_pct: 0.20  # close if price falls >20% from the position's all-time high
                           # (0.15 whipsawed out of every eventual winner in the 2024-26 event study)
  rebalance_threshold: 0.05 # trim/top-up held BUY positions when weight drifts > 5%
  cgt_rate: 0.33            # Irish CGT rate; inflates effective trim threshold on winners
  vix_halt_threshold: 25    # halt new buys when VIX closes above this level
  earnings_avoid_days: 3    # skip opening new position if earnings within this many days
  # ── Core parking: keep idle cash invested in a broad-market ETF ────────────
  core_parking_ticker: SPY  # sweep idle cash here; sold to fund signal BUYs; "" disables
  core_cash_buffer_pct: 0.02 # equity fraction kept as cash (fee/slippage headroom)
  # ── Short overlay: open shorts on robust SELL signals ──────────────────────
  short_pos_pct: 0.04       # equity fraction per short position (whole shares only)
  short_max_total_pct: 0.12 # cap on gross short exposure; 0 disables shorting
