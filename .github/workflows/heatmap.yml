name: Market Heatmap

# Fires at 22:15 UTC Mon-Fri — 15 min after the paper_trade workflow at
# 22:00 UTC, so full-day US price data is settled and we don't contend for
# the same yfinance connection pool.

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CJK fonts (matplotlib chart labels)
        run: |
          sudo apt-get install -y fonts-wqy-microhei
          python -c "import matplotlib; import shutil; shutil.rmtree(matplotlib.get_cachedir(), ignore_errors=True)"

      - name: Run heatmap
        env:
          RUN_MODE:            heatmap
          # Email delivery
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          REPORT_TO_EMAIL:     ${{ secrets.REPORT_TO_EMAIL }}
          RECIPIENT_EMAIL:     ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py
